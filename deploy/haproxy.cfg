global
  maxconn 64

defaults
  mode http
  timeout connect 2s
  timeout client 30s
  timeout server 30s
  timeout check 2s
  retries 3
  option redispatch

frontend diary
  bind 127.0.0.1:8080
  default_backend diary_nodes

backend diary_nodes
  balance roundrobin
  option http-server-close
  option httpchk GET /diary
  http-check expect status 200
  retry-on all-retryable-errors
  server local 127.0.0.1:18080 check inter 1s fall 1 rise 1 on-marked-down shutdown-sessions
  server peer 127.0.0.1:18081 check inter 1s fall 1 rise 1
