global
  maxconn 64

defaults
  mode http
  timeout connect 2s
  timeout client 30s
  timeout server 30s
  timeout check 2s
  retries 3
  option redispatch

frontend diary
  bind 127.0.0.1:8080
  default_backend diary_nodes

backend diary_nodes
  balance roundrobin
  option http-server-close
  option httpchk OPTIONS /diary
  http-check expect status 200
  retry-on all-retryable-errors
  # 두 서버가 같은 설정을 쓴다. 자기 앱도 사설 IP로 붙는다 (ssh 터널 대신 사설망 직결)
  server oci-diary 10.0.0.108:18080 check inter 5s fall 1 rise 1 on-marked-down shutdown-sessions
  server oci-diary-2 10.0.0.19:18080 check inter 5s fall 1 rise 1 on-marked-down shutdown-sessions
