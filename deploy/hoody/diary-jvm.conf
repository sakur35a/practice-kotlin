# diary-run(운영 실행)과 diary-pull-deploy(AOT 캐시 훈련)가 같이 읽는다. 둘이 같은 플래그여야 캐시가 맞는다.
#
# 메모리 예산: hoody 컴퓨터 하나가 CPU 2코어와 6GB를 모두 쓴다 (cgroup의 cpu.max와 memory.max로 확인한 값이다. nproc의 12는 호스트 값이다).
# 스왑은 없다. 이 안에서 같이 도는 것 (2026-11-20 실측):
#   이 JVM         힙 최대 2G + 메타스페이스(약 110MB)·코드 캐시·스레드·G1 자료구조·네이티브 약 350MB = 최대 약 2.4GB.
#                  실제로는 cgroup 약 400MB이고, GC 직전 힙이 가장 커도 105MB, GC 뒤 살아 있는 데이터는 약 40MB다
#   PostgreSQL     약 90MB (프로세스 RSS 합). DB는 diary 하나뿐이다
#   cloudflared    약 50MB,  hoody 에이전트(hoody-*, supervisord) 약 250MB
#   빌드(Gradle)   배포 때 최대 2GB (diary-deploy.service의 MemoryMax). 앱과 겹치는 시간은 몇 분이다
#   상한끼리 더하면 앱 3G(MemoryMax) + 빌드 2G + 나머지 0.4G = 약 5.4GB로 6GB 안이다.
#   2026-11-20에 첫마디의 요약 LLM(llama-server, MemoryMax 3500M)이 Cloudflare Workers AI로 떠나서 그 자리만큼 힙을 768M에서 2G로 키웠다.
#   스왑이 없어서 OOM은 곧 프로세스 종료이므로, 앱 유닛에 MemoryMax=3000M을 두었다.
#
# 512MB 컨테이너 시절 설정에서 바꾼 것과 이유 (deploy/README.md 5절)
#   유지  -XX:TieredStopAtLevel=1   이유가 메모리에서 CPU로 바뀌었다. 코어 2개를 PostgreSQL, cloudflared, 다른 앱, 배포 빌드와 나눠 쓰므로
#                                    C2 컴파일 폭주(시작 직후 한 코어를 몇 초 점유)를 피한다. 트래픽 대부분은 Cloudflare 엣지 캐시에서 끝나서
#                                    최고 처리량보다 CPU 점유가 중요하다
#   유지  -XX:ReservedCodeCacheSize=96M, -XX:MetaspaceSize=128M   메타스페이스 사용량(약 110MB)이 초기 임계값을 넘을 때 나는 Full GC를 피한다
#   유지  -Xlog:gc,gc+metaspace=info   값이 싸고 위 Full GC 진단에 쓴다
#   삭제  -Xss512k                 스레드 수십 개라 메모리 이득이 없고, 기본 1MB가 Hibernate/Jackson 깊은 호출에 안전하다
#   삭제  BPL_JVM_THREAD_COUNT, BPL_JVM_CLASS_ADJUSTMENT   buildpack 메모리 계산기 입력이었다. 이제 힙을 직접 정한다
#   삭제  --memory=512m(컨테이너 상한)   systemd MemoryMax로 대체했다
#   추가  -Xms256m -Xmx2g          직접 정한 힙. 평소에는 수십 MB만 살아 있어서 시작은 256M로 하고, 몰릴 때(ETag 필터가 응답을 통째로
#                                  버퍼링하는 큰 목록 등) 2G까지 늘 수 있게 했다. 768M에서 2G로 키운 것은 LLM이 떠나 메모리가 비어서다
#   추가  -XX:+UseG1GC             힙이 2G까지 커지면 Serial은 전체 GC 한 번에 힙 전체를 한 스레드로 훑어서 정지가 길어진다(힙에 비례).
#                                  G1은 힙을 영역으로 나눠 젊은 영역만 자주 치우고, 오래된 영역은 동시에 표시해서 정지를 목표(기본 200ms) 안에 둔다.
#                                  ZGC는 정지가 더 짧지만 동시 작업에 CPU와 여유 메모리를 더 써서 2코어를 PostgreSQL·빌드와 나눠 쓰는 이 컴퓨터에는 맞지 않는다
#   추가  -XX:ParallelGCThreads=2, -XX:ConcGCThreads=1   이 컴퓨터의 JDK 25는 호스트 코어 12개를 보고 GC 스레드를 10개(동시 표시 2개) 만든다
#                                  (2026-11-20 -XX:+PrintFlagsFinal로 확인. cgroup의 2코어 상한을 읽지 못한다). 2코어에서 10개가 함께 돌면
#                                  서로 기다리기만 하니, 정지 중 GC는 코어 수만큼, 동시 표시는 앱 몫 한 코어를 남기고 1개로 정한다
#   추가  -XX:G1PeriodicGCInterval=300000   5분 동안 GC가 없으면 G1이 동시 GC를 한 번 돌려 쓰지 않는 힙을 OS에 돌려준다.
#                                  몰릴 때 늘어난 힙을 계속 들고 있지 않아야 같은 컴퓨터의 배포 빌드(최대 2G)가 들어갈 자리가 남는다
#   추가  -XX:MaxMetaspaceSize=256M, -XX:+ExitOnOutOfMemoryError   누수나 OOM이 컴퓨터를 끌고 가지 않게 하고, systemd가 바로 다시 띄운다
#   추가  --enable-native-access=ALL-UNNAMED   junixsocket(유닉스 소켓 JDBC)의 JNI 라이브러리를 JDK 25가 경고 없이 읽게 한다
JVM_FLAGS=(
  -Xms256m
  -Xmx2g
  -XX:+UseG1GC
  -XX:ParallelGCThreads=2
  -XX:ConcGCThreads=1
  -XX:G1PeriodicGCInterval=300000
  -XX:TieredStopAtLevel=1
  -XX:ReservedCodeCacheSize=96M
  -XX:MetaspaceSize=128M
  -XX:MaxMetaspaceSize=256M
  -XX:+ExitOnOutOfMemoryError
  --enable-native-access=ALL-UNNAMED
  -Xlog:gc,gc+metaspace=info
)
