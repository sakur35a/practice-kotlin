spring:
  application:
    name: diary
  datasource:
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      connection-timeout: 2000
      validation-timeout: 1000
      # DB 재시작(점검) 뒤 죽은 연결을 요청 전에 걸러낸다
      keepalive-time: 30000
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway가 관리하고 Hibernate는 엔티티와 맞는지 확인만 한다
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  profiles:
    default: local
management:
  # 컨테이너 밖에는 127.0.0.1로만 노출한다 (deploy/start.sh)
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
server:
  tomcat:
    threads:
      max: 32
      min-spare: 2
slack:
  webhook-url: ${SLACK_WEBHOOK_URL:http://localhost:8080/dummy}
diary:
  cloudflare:
    # 글이 써지면 엣지에 캐시된 목록을 purge한다. 비어 있으면 건너뛴다
    zone-id: ${CLOUDFLARE_ZONE_ID:}
    api-token: ${CLOUDFLARE_API_TOKEN:}
