name: CI

# main에 올라온 뒤의 검사와 배포는 deploy.yml이 한다. 이 워크플로는 PR만 본다.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Testcontainers가 PostgreSQL 17 컨테이너를 띄운다 (ubuntu-latest에 Docker가 있다)
      - name: Run checks
        run: ./gradlew check
