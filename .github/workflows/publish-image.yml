name: Publish container image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image version (for example, 0.0.1)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run checks
        run: ./gradlew check

  publish:
    needs: check
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine image name
        id: image
        run: echo "name=ghcr.io/sakur35a/practice-kotlin:${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Build and publish image
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew bootBuildImage \
            -PappVersion="${{ steps.version.outputs.version }}" \
            --imagePlatform=linux/amd64 \
            --publishImage

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure SSH
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_HOST_2: ${{ secrets.OCI_HOST_2 }}
          OCI_SSH_KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          : "${OCI_HOST:?OCI_HOST is required}"
          : "${OCI_HOST_2:?OCI_HOST_2 is required}"
          : "${OCI_USER:?OCI_USER is required}"
          : "${OCI_SSH_PRIVATE_KEY:?OCI_SSH_PRIVATE_KEY is required}"
          : "${OCI_SSH_KNOWN_HOSTS:?OCI_SSH_KNOWN_HOSTS is required}"

          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/id_oci"
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_oci"
          printf '%s\n' "$OCI_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Upload deployment scripts
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_HOST_2: ${{ secrets.OCI_HOST_2 }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          for host in "$OCI_HOST" "$OCI_HOST_2"; do
            scp -i "$HOME/.ssh/id_oci" \
              deploy/start.sh deploy/deploy.sh deploy/haproxy.cfg \
              "$OCI_USER@$host:/home/$OCI_USER/"
          done

      - name: Deploy image
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_HOST_2: ${{ secrets.OCI_HOST_2 }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          for host in "$OCI_HOST" "$OCI_HOST_2"; do
            ssh -i "$HOME/.ssh/id_oci" "$OCI_USER@$host" \
              "chmod 700 /home/$OCI_USER/start.sh /home/$OCI_USER/deploy.sh && podman restart haproxy >/dev/null && /home/$OCI_USER/deploy.sh '$IMAGE'"
          done

      - name: Verify public API
        run: |
          # diary-6c6.pages.dev는 정적 프론트라 /api/diary가 HTML을 주므로 백엔드가 죽어도 통과한다.
          # 프론트가 실제로 호출하는 API 도메인을 확인하고, 응답이 JSON 목록인지도 본다.
          # 엣지 캐시 적중(5분)만으로 통과하지 않도록 실행마다 다른 값을 붙여 항상 서버까지 가게 한다.
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors \
            --max-time 15 \
            'https://api.ssobbs13.pp.ua/diary?size=1&v=${{ github.run_id }}' \
            | grep -q '"items"'
