# 로컬 개발용 PostgreSQL. 운영과 같은 17 버전을 쓴다 (application-local.yaml이 이 값으로 붙는다)
services:
  postgres:
    image: postgres:17-alpine
    container_name: diary-postgres
    restart: always
    environment:
      POSTGRES_USER: diary
      POSTGRES_PASSWORD: diary
      POSTGRES_DB: diary
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
